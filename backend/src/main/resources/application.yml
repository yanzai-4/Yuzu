# v0.0.7 🍊 Default configuration of the Yuzu backend. Local overrides go to application-local.yml (gitignored).
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: yuzu
  threads:
    virtual:
      enabled: true
  datasource:
    # Project-local MySQL instance managed by scripts/db.sh (port 3307, UTC, stopwords disabled).
    url: jdbc:mysql://127.0.0.1:${YUZU_DB_PORT:3307}/${YUZU_DB_NAME:yuzu}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048
    username: ${YUZU_DB_USER:yuzu}
    password: ${YUZU_DB_PASSWORD:yuzu_local_dev}
    hikari:
      pool-name: yuzu-db
      maximum-pool-size: 20
      minimum-idle: 4
      # ngram FULLTEXT must never see stopwords (they drop every token that contains them).
      connection-init-sql: SET SESSION innodb_ft_enable_stopword = OFF
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      request-timeout: -1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

yuzu:
  llm:
    budget:
      # v0.0.31 🍊 Automatic pause for model calls. 0 / unset means unlimited (the demo default).
      # When a ceiling is reached the priority gate refuses new calls, the console gets one error banner,
      # and every module degrades gracefully instead of eight agents hammering the provider.
      max-total-tokens: 0
      max-cost-usd: 0
      usd-per-million-tokens: 0
  # Workgroup time zone used for every natural-language time shown to agents and humans.
  zone: America/Los_Angeles
  # Root directory of the per-agent workspaces (large storage).
  workspace-root: ../workspaces
  # Directory of the master key that encrypts stored API keys (outside the repository; gitignored).
  secret-dir: ../data/secret
  # Origins allowed to call the API directly (the Vite dev server proxies, so this is rarely needed).
  cors-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
