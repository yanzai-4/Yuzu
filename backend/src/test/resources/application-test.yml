# v0.0.8 🍊 Test profile: uses yuzu_test (or $YUZU_TEST_DB for parallel worktrees) on the local MySQL instance.
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:${YUZU_DB_PORT:3307}/${YUZU_TEST_DB:yuzu_test}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048
  flyway:
    clean-disabled: false
yuzu:
  workspace-root: ../data/test-workspaces
  secret-dir: ../data/test-secret
